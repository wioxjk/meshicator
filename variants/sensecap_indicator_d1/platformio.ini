[SenseCapIndicator_D1]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default.csv
build_flags =
  ${esp32_base.build_flags}
  ; the generic esp32-s3-devkitc-1 board definition defaults Serial to
  ; hardware UART0 (fixed pins GPIO43/44), not the USB-C port -- on this
  ; board those UART0 pins go to the RP2040 co-processor, not anywhere
  ; the user can see, so without this flag every Serial.print() vanishes
  ; and the flashing/debug USB port stays silent once the app is running.
  ; (heltec_tracker's platformio.ini, using this same generic board id,
  ; hits the identical issue -- see its "need for Serial" comment.)
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  ; P_LORA_NSS/P_LORA_DIO_1: this board's real SX1262 NSS/DIO1 lines are on
  ; the TCA9535 IO expander (IOEXP_LORA_NSS/IOEXP_LORA_DIO1 in pins.h), not
  ; native GPIOs -- but helpers/ESP32Board.h/.cpp reference these two macros
  ; unconditionally in code paths this board never actually uses (deep sleep
  ; GPIO-hold, and the wake-on-LoRa-packet light sleep SenseCapD1Board.h
  ; overrides), so they still need *some* value for that shared code to
  ; compile. GPIO43/44 are otherwise unused by this firmware (wired to the
  ; RP2040 co-processor's UART, which we don't talk to). Must be build_flags,
  ; not a #define in pins.h: ESP32Board.cpp includes "ESP32Board.h" (where
  ; the inline getIRQGpio() uses P_LORA_DIO_1) before it includes
  ; <target.h>, so a header #define would arrive one include too late.
  -D P_LORA_NSS=43
  -D P_LORA_DIO_1=44
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D LORA_TX_POWER=22
  -D DISPLAY_CLASS=IndicatorDisplay
  -D IO_EXPANDER=0x40
  -I variants/sensecap_indicator_d1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sensecap_indicator_d1/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
lib_deps = ${esp32_base.lib_deps}
  adafruit/Adafruit BusIO @ ^1.17.2
  lovyan03/LovyanGFX @ ^1.2.7

; "Channel Board" -- a calm, always-on message board that shows recent
; text messages from a small set of configured #channels. See
; examples/channel_board/README.md for what it does and how to set it up.
[env:SenseCapIndicator_D1_channel_board]
extends = SenseCapIndicator_D1
build_flags =
  ${SenseCapIndicator_D1.build_flags}
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${SenseCapIndicator_D1.build_src_filter}
  +<../examples/channel_board/*.cpp>
lib_deps = ${SenseCapIndicator_D1.lib_deps}
  densaugeo/base64 @ ~1.4.0
